# Live check: what https://groundstatemethod.com serves, against main.
#
# Not a required check and not run on pull requests: it reads the live site.
# Daily, and on demand (Actions → live-check → Run workflow), e.g. a few
# minutes after a merge has deployed. Read-only token, no secrets; the contact
# probe sends no Turnstile token, so it is refused before any email is sent.
# A failed scheduled run notifies the repository owner by email.
name: live-check

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: live-check
  cancel-in-progress: false

jobs:
  live-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsx scripts/live-check.ts
